directories:
  output: build-output
  buildResources: public
appId: com.yourcompany.pos
productName: POS System
files:
  - filter:
      - electron/**/*
      - package.json
      - '!node_modules/**/*'
      - '!.next/**/*'
      - '!dist/**/*'
      - '!.git/**/*'
extraResources:
  - from: .next/standalone
    to: app
    filter:
      - '**/*'
  - from: .next/static
    to: app/.next/static
    filter:
      - '**/*'
  - from: public
    to: app/public
    filter:
      - '**/*'
asarUnpack:
  - '**/*.node'
win:
  target:
    - target: dir
      arch:
        - x64
  icon: public/icons/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: POS System
  installerIcon: public/icons/icon.ico
  uninstallerIcon: public/icons/icon.ico
  perMachine: true
mac:
  target:
    - dmg
  icon: public/icons/icon-512x512.png
  category: public.app-category.business
linux:
  target:
    - AppImage
  icon: public/icons/icon-512x512.png
  category: Office
electronVersion: 34.5.8
